server_tokens off;
upstream django {
    server crowdsourcing-app:8003;
}
server {
    listen 80;

    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        autoindex on;
        autoindex_exact_size off;
        alias /opt/application/webapp/staticfiles/;
    }
}
